# 更新文档站更新日志
#
# 触发方式：
#   - release 发布后自动运行（release: published）
#   - 手动触发（workflow_dispatch），例如补录历史版本后手动刷新
#
# 逻辑：用 GitHub API 拉取所有 releases，
#   生成 docs_website/changelog/ 下的更新日志页面并 commit 回 main。
name: Update Website Changelog

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update changelog pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Generate changelog pages
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = require('path')

            const CHANGELOG_DIR = 'docs_website/changelog'
            const CHANGELOG_MD = 'CHANGELOG.md'

            function versionKey(tag) {
              const base = tag.replace(/^v/, '')
              const m = /^(\d+)\.(\d+)\.(\d+)(?:-(.+))?$/.exec(base)
              if (!m) return [0, 0, 0, 1, base]
              const pre = m[4]
              return [+m[1], +m[2], +m[3], pre ? 1 : 0, pre || '']
            }

            function renderPage(entry, order) {
              const tag = entry.tag
              const title = tag.startsWith('v') ? tag : `v${tag}`
              const dateLine = entry.date ? `- 发布日期：${entry.date}` : ''
              const content = entry.body ? entry.body.trimEnd() + '\n' : '*暂无此版本的更新日志。*\n'
              return `---
            title: ${title}
            icon: mdi:history
            order: ${order}
            ---

            # ${title}

            ${dateLine}

            ${content}
            `
            }

            function renderIndex(entries) {
              const lines = [
                '---', 'title: 更新日志', 'icon: mdi:history',
                'dir:', '  order: 2', '---', '',
                '# 更新日志', '',
                '本栏目按版本记录不高山上的功能更新与修复。内容随 GitHub Release 自动更新。',
                '', '## 版本记录', '',
              ]
              entries.forEach((e, i) => {
                const title = e.tag.startsWith('v') ? e.tag : `v${e.tag}`
                const date = e.date ? `（${e.date}）` : ''
                lines.push(`${i + 1}. [${title}](./${e.tag}.md)${date}`)
              })
              lines.push('')
              return lines.join('\n')
            }

            // 1. 尝试从 GitHub API 拉取 releases
            let entries = null
            try {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              })
              entries = releases
                .map(r => ({
                  tag: (r.tag_name || '').replace(/^v/, ''),
                  date: (r.published_at || '').slice(0, 10),
                  body: (r.body || '').trim(),
                }))
                .filter(e => e.tag)
              console.log(`从 GitHub API 拉取到 ${entries.length} 个 release`)
            } catch (err) {
              console.log(`GitHub API 拉取失败（${err.message}），回退到 CHANGELOG.md`)
            }

            // 2. 兜底：从 CHANGELOG.md 解析
            if (entries === null || entries.length === 0) {
              if (fs.existsSync(CHANGELOG_MD)) {
                const content = fs.readFileSync(CHANGELOG_MD, 'utf-8')
                entries = content
                  .split(/^##\s+/m)
                  .slice(1)
                  .map(section => {
                    const nl = section.indexOf('\n')
                    const header = nl === -1 ? section.trim() : section.slice(0, nl).trim()
                    const body = nl === -1 ? '' : section.slice(nl + 1).trim()
                    const m = /^\[?([^\]]+)\]?(?:\s*-\s*(\d{4}-\d{2}-\d{2}))?\s*$/.exec(header)
                    if (!m || m[1].toLowerCase() === 'unreleased') return null
                    return { tag: m[1], date: m[2] || '', body }
                  })
                  .filter(Boolean)
                console.log(`从 CHANGELOG.md 解析到 ${entries.length} 个版本`)
              }
            }

            if (!entries || entries.length === 0) {
              core.setFailed('没有可用的更新日志数据')
            }
            entries.sort((a, b) => {
              const ka = versionKey(a.tag)
              const kb = versionKey(b.tag)
              for (let i = 0; i < ka.length; i++) {
                if (ka[i] !== kb[i]) return ka[i] < kb[i] ? 1 : -1
              }
              return 0
            })

            // 3. 写入各版本页面 + 首页 + 最新版
            fs.mkdirSync(CHANGELOG_DIR, { recursive: true })
            entries.forEach((e, i) => {
              const p = path.join(CHANGELOG_DIR, `${e.tag}.md`)
              fs.writeFileSync(p, renderPage(e, i + 1))
            })
            fs.writeFileSync(path.join(CHANGELOG_DIR, 'README.md'), renderIndex(entries))

            const latest = entries[0]
            const latestTitle = latest.tag.startsWith('v') ? latest.tag : `v${latest.tag}`

            // 把 CHANGELOG 正文转成不含标题的格式，避免污染用户文档的右侧目录（TOC）。
            // 标题（## 版本号 / ### Added 等）会进入 TOC，因此这里转成加粗文本。
            function stripTocHeadings(body) {
              if (!body) return '*暂无此版本的更新日志。*\n'
              return body
                .split('\n')
                .map(line => {
                  if (/^#{1,3}\s+/.test(line)) return `**${line.replace(/^#{1,3}\s+/, '')}**`
                  return line
                })
                .join('\n')
                .trimEnd() + '\n'
            }

            const latestBody = stripTocHeadings(latest.body)
            fs.writeFileSync(
              path.join(CHANGELOG_DIR, '_latest.md'),
              `**当前版本：${latestTitle}**\n\n${latestBody}`,
            )
            console.log(`✍ 已生成 ${entries.length} 个版本页面，最新版 ${latest.tag}`)

      - name: Commit & push changelog (safety net)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No website changelog changes to commit."
          else
            git add docs_website/changelog/
            git commit -m "chore: update website changelog from releases"
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; echo "rebase failed, continuing"; }
            git push origin HEAD:main || echo "safety-net push failed (main moved on), continuing"
          fi
